# This workflow reuses the openHIE GitHub action for building IGs
# Initial idea by Carl Leitner, developed by Elliot Silver, available from: https://www.argentixinfo.com/archives/156
# Change log:
# v0.1.0
# 2021-06-18: publish default branches to / , other branches branches/<branch>
# 2021-11-26: reusable workflow

name: FHIR CI Build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events for any main branch
  push:
    branches-ignore:    
      - 'gh-pages'
  pull_request:

  workflow_dispatch:

jobs:
  crmi_validation:
    name: Build and validate CRMI StructureDefinitions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install --global fsh-sushi@3.20.1

      - name: Test CRMI validation gate
        run: node tests/validate-crmi.test.js

      - name: Install IG Publisher
        run: |
          mkdir -p input-cache
          curl --fail --location --silent --show-error \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            --output input-cache/publisher.jar

      - name: Build IG and enforce CRMI conformance
        run: ./_genonce.sh

  # This workflow contains a single job called "build"
  call_build: 
    uses: WorldHealthOrganization/smart-base/.github/workflows/fhirbuild.yml@main
